include=~/.config/foot/theme.ini

[main]
font=JetBrainsMono Nerd Font:size=13:antialias=true:hintstyle=full
pad=0x1
gamma-correct-blending=yes

[bell]
system=no

[mouse]
hide-when-typing=true

[cursor]
style=block
blink=no
unfocused-style=unchanged

[key-bindings]
scrollback-up-line=none
scrollback-down-line=none
