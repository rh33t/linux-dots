# Workspace navigation (bindcode = physical key position, layout-independent)
# Keycodes 10-19 = number row keys (&/1 through à/0 on AZERTY)
bindcode $mod+10 workspace $ws1
bindcode $mod+11 workspace $ws2
bindcode $mod+12 workspace $ws3
bindcode $mod+13 workspace $ws4
bindcode $mod+14 workspace $ws5
bindcode $mod+15 workspace $ws6
bindcode $mod+16 workspace $ws7
bindcode $mod+17 workspace $ws8
bindcode $mod+18 workspace $ws9
bindcode $mod+19 workspace $ws10
bindcode $alt+10 workspace $ws11
bindcode $mod+49 workspace $ws7
bindsym $mod+Tab workspace next
bindsym $mod+$shift+Tab workspace prev

# Move containers to workspace
bindcode $mod+$shift+10 move container to workspace $ws1
bindcode $mod+$shift+11 move container to workspace $ws2
bindcode $mod+$shift+12 move container to workspace $ws3
bindcode $mod+$shift+13 move container to workspace $ws4
bindcode $mod+$shift+14 move container to workspace $ws5
bindcode $mod+$shift+15 move container to workspace $ws6
bindcode $mod+$shift+16 move container to workspace $ws7
bindcode $mod+$shift+17 move container to workspace $ws8
bindcode $mod+$shift+18 move container to workspace $ws9
bindcode $mod+$shift+19 move container to workspace $ws10
bindcode $mod+$alt+10 move container to workspace $ws11

# Window management
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+m split h
bindsym $mod+z split v
bindsym $mod+s layout stacking
bindsym $mod+g layout tabbed
bindsym $mod+r layout toggle split
bindsym $mod+$shift+space floating toggle
bindsym $mod+a focus parent
bindsym $mod+y focus mode_toggle
bindsym $mod+x [urgent=latest] focus
bindsym $mod+$shift+x exec swaymsg kill
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+$shift+Left move left
bindsym $mod+$shift+Down move down
bindsym $mod+$shift+Up move up
bindsym $mod+$shift+Right move right

# Resize controls
bindsym $mod+Ctrl+Right resize shrink width 1 px or 1 ppt
bindsym $mod+Ctrl+Up resize grow height 1 px or 1 ppt
bindsym $mod+Ctrl+Down resize shrink height 1 px or 1 ppt
bindsym $mod+Ctrl+Left resize grow width 1 px or 1 ppt

# Sway control
bindsym $mod+$shift+percent reload
bindsym $mod+$shift+r reload

# Applications
bindsym $mod+Return exec foot --title "daily" zsh -c "tmux new -A -s daily"
bindsym $mod+$shift+Return exec ghostty -e tmux new-session -A -s daily
bindsym $mod+t exec kitty --working-directory=~ -e zsh
bindsym $mod+e exec /usr/bin/thunar
bindsym $mod+b exec /usr/bin/brave-origin
bindsym $mod+v exec copyq show
bindsym $mod+d exec rofi -show run
bindsym $mod+space exec "rofi -show combi -modi window,drun,combi -combi-modi window,drun -config ~/.config/rofi/rofidmenu.rasi -matching fuzzy"
bindsym $mod+semicolon exec rofimoji --selector rofi --selector-args "-theme ~/.config/rofi/emoji.rasi" --action type copy
bindsym $mod+$shift+c exec hyprpicker -a && notify-send 'Color Picked!'
bindsym $mod+o exec obsidian
bindsym $mod+$shift+a exec ~/.local/share/scripts/emulator-launcher
bindsym $mod+$shift+b exec pkill -SIGUSR1 waybar

# Shortcuts
bindsym $mod+h exec kitty --app-id "shortcut" --title "Shortcut: htop" zsh -c "htop"
bindsym $mod+n exec kitty --app-id "shortcut" --title "Shortcut: notes" zsh -c "nvim ~/personal/notes.md"
bindsym $mod+$shift+o exec kitty --title "Shortcut: OpenCode VM" -e bash -c "cd ~/labs/workspace/opencode-vm && vagrant up && vagrant ssh"

# Screenshots (grim+slurp replace maim+xclip)
bindsym $mod+F10 exec bash -c 'mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png'
bindsym $mod+$shift+s exec grim -g "$(slurp -d)" - | wl-copy

# System controls
bindsym $mod+l exec ~/.config/sway/scripts/lockscreen
bindsym $mod+$shift+e exec ~/.config/sway/scripts/powermenu
bindsym $mod+$shift+w exec ~/.config/sway/scripts/empty-workspace
bindsym $mod+$shift+n exec networkmanager_dmenu

# Media keys
bindsym XF86AudioMicMute exec amixer sset Capture toggle
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioMute exec ~/.config/sway/scripts/volume mute
bindsym XF86AudioRaiseVolume exec ~/.config/sway/scripts/volume up
bindsym XF86AudioLowerVolume exec ~/.config/sway/scripts/volume down
bindsym $mod+XF86AudioRaiseVolume exec amixer -D pulse sset Master 1%+
bindsym $mod+XF86AudioLowerVolume exec amixer -D pulse sset Master 1%-
bindsym $mod+F12 exec ~/.local/share/scripts/audio-manager toggle

# Brightness controls
bindsym XF86MonBrightnessDown exec ~/.config/sway/scripts/brightness down
bindsym XF86MonBrightnessUp exec ~/.config/sway/scripts/brightness up

# Modes
bindsym $mod+u mode "utilities"
mode "utilities" {
    bindsym f exec wal -b swaybg -s -i ~/Pictures/wallpapers/favourites
    bindsym c exec mate-calculator
    bindsym Escape mode "default"
    bindsym Return mode "default"
}

bindsym $alt+r mode "resize"
mode "resize" {
    bindsym Left resize shrink width 5 px or 5 ppt
    bindsym Down resize grow height 5 px or 5 ppt
    bindsym Up resize shrink height 5 px or 5 ppt
    bindsym Right resize grow width 5 px or 5 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
}

# VM passthrough: only this toggle is bound, every other key (incl. $mod
# combos like $mod+Return) falls through unhandled to the focused window
# instead of being grabbed by sway, so a focused VM receives them.
bindsym $mod+Escape mode "vm"
mode "vm" {
    bindsym $mod+Escape mode "default"
}
