# Many rules below list both class= and app_id= for the same app.
# This is intentional: whether an app shows up as class (XWayland/X11) or
# app_id (native Wayland) depends on its runtime mode (e.g. electron apps
# need --ozone-platform=wayland to go native), which isn't always known
# ahead of time. An unmatched selector is a silent no-op, so listing both
# makes the rule fire regardless of which mode the app actually used.
#
# Source of truth for which apps go where: ~/.dotfiles/hypr/.config/hypr/conf/windowrules.lua

# Application workspace assignments
# Kitty/foot use app_id on Wayland (--class sets app_id)
assign [app_id="kitty" title="^daily"] $ws1
assign [app_id="foot" title="^daily"] $ws1
assign [class="code"] $ws2
assign [app_id="code"] $ws2
assign [class="(?i)jetbrains-"] $ws2
assign [class="(?i)brave" instance="brave-origin"] $ws3
assign [app_id="brave-origin"] $ws3
assign [class="TelegramDesktop"] $ws4
assign [app_id="org.telegram.desktop"] $ws4
assign [class="discord"] $ws4
assign [app_id="discord"] $ws4
assign [class="Brave-origin" instance="crx_hnpfjngllnobngcgfapefoaidbinmjnm"] $ws4
assign [app_id="brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default"] $ws4
assign [class="obsidian"] $ws5
assign [app_id="obsidian"] $ws5
assign [class="Spotify"] $ws6
assign [app_id="spotify"] $ws6
assign [class="mpv"] $ws6
assign [app_id="mpv"] $ws6
# ws7 (VirtualBox/virt-manager/vmware) disabled, matching windowrules.lua
# assign [class="(?i)VirtualBox|virt-manager|vmware"] $ws7
assign [class="obs"] $ws8
assign [app_id="com.obsproject.Studio"] $ws8
assign [class="protonvpn-app"] $ws10
assign [app_id="proton.vpn.app.gtk"] $ws10

# Auto focus rules (only the daily-journal terminal steals focus, matching
# hyprland's silent=false; everything else opens silently in the background)
for_window [app_id="kitty" title="^daily"] focus
for_window [app_id="foot" title="^daily"] focus

# Borders (apply to both XWayland and native Wayland)
for_window [class=".*"] border pixel 1
for_window [app_id=".*"] border pixel 1
for_window [app_id="com.mitchellh.ghostty"] border pixel 0
for_window [class="wezterm"] border pixel 0
for_window [class="Emulator"] border pixel 0

# Floating rules (app_id="shortcut" because kitty --class sets app_id on Wayland)
for_window [app_id="shortcut"] floating enable, resize set 800 600, move position center
for_window [class="shortcut"] floating enable, resize set 800 600, move position center
for_window [title="Shortcut: OpenCode VM"] floating enable, resize set 1600 900, move position center
for_window [class="copyq"] floating enable, resize set 800 600, move position center
for_window [app_id="com.github.hluk.copyq"] floating enable, resize set 800 600, move position center
for_window [app_id="brave-nngceckbapebfimnlniiiahkandclblb-Default"] floating enable, resize set 400 600, move position center
for_window [class="GParted"] floating enable, resize set 800 600, move position center
for_window [class="Nwg-look"] floating enable, resize set 800 600, move position center
for_window [app_id="nwg-look"] floating enable, resize set 800 600, move position center
for_window [class="Nm-connection-editor"] floating enable, resize set 800 600, move position center
for_window [class="Arandr"] floating enable, resize set 800 600, move position center
for_window [app_id="arandr"] floating enable, resize set 800 600, move position center
for_window [class="Kvantum Manager"] floating enable, resize set 800 600, move position center
for_window [app_id="kvantummanager"] floating enable, resize set 800 600, move position center
for_window [class="protonvpn-app"] floating enable, move position center
for_window [app_id="proton.vpn.app.gtk"] floating enable, move position center
for_window [class="Anydesk"] floating enable, move position center
for_window [class="easyeffects"] floating enable, move position center
for_window [app_id="org.kde.easyeffects"] floating enable, move position center
for_window [app_id="org.gnome.DiskUtility"] floating enable, resize set 800 600, move position center
for_window [class="Gnome-disks"] floating enable, resize set 800 600, move position center
for_window [class="Seahorse"] floating enable, move position center
for_window [class="pavucontrol"] floating enable, move position center
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable, move position center
for_window [class="qt5ct"] floating enable, move position center
for_window [class="qt6ct"] floating enable, move position center
for_window [app_id="qt6ct"] floating enable, move position center
for_window [class="Emulator"] floating enable
for_window [app_id="flameshot"] floating enable
for_window [title="^Welcome to.*"] floating enable, move position center
for_window [app_id="thunar" title="^(Rename |File Operation Progress$)"] floating enable, move position center
for_window [floating] move position center
for_window [workspace="4"] layout tabbed
for_window [class="Brave-origin" instance="crx_hnpfjngllnobngcgfapefoaidbinmjnm"] floating disable
for_window [app_id="brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default"] floating disable
